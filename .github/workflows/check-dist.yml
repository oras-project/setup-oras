name: Check dist/

on:
  push:
    # Skip floating tag moves (vX, vX.Y) pushed by the release workflows.
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: remove js files in dist/
        run: find dist/ -type f \( -name "*.json" -o -name "*.js" -o -name "*.js.map" \) -delete
      - name: Setup Node 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Rebuild the dist/ directory
        run: npm run build
      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "DIFFERENCES DETECTED: 'npm run build' is needed after code changes. See status below:"
            git diff
            exit 1
          fi

  # Dependabot only edits the manifest, so the check above is right to fail on
  # its branches: the bundled dependency in dist/index.js still carries the old
  # version. Rebuild the bundle there and push it back, so a bump of a bundled
  # dependency can reach a green run without a maintainer pushing the artifact.
  #
  # The build and the push are deliberately separate jobs. `npm ci` runs the
  # install scripts of the bumped package, and an install script that can read
  # PUSH_TOKEN could publish a release that moves the floating `v2` tag. The
  # build job therefore gets no token and only `contents: read`; the push job
  # holds the token and runs no npm command at all.
  rebuild-dependabot:
    # Dependabot branches live in this repository, so a job-level `permissions:`
    # block is honoured and `pull_request_target` (which would run PR code with
    # an elevated token) is not needed. The guard reads the PR author and the
    # head repository, not `github.actor`, which becomes whoever re-runs the job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # Same delete, build and compare as the check-dist job above: the artifact
      # has to be byte-for-byte what that comparison expects.
      - name: remove js files in dist/
        run: find dist/ -type f \( -name "*.json" -o -name "*.js" -o -name "*.js.map" \) -delete
      - name: Setup Node 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild the dist/ directory
        run: npm run build
      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "dist/ differs from the bumped manifest; the push job commits it."
            git diff --stat dist/
          else
            echo "dist/ already matches the manifest; the push job will skip."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-dependabot
          path: dist/
          if-no-files-found: error
          retention-days: 1

  push-dependabot:
    needs: rebuild-dependabot
    runs-on: ubuntu-latest
    # Concurrent runs of this PR would race the push and fail non-fast-forward.
    concurrency:
      group: rebuild-dependabot-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      # No persisted GITHUB_TOKEN credential: checkout leaves an auth header in
      # the git config that would otherwise push the commit with GITHUB_TOKEN
      # (and then no workflow run would be started for it). The PAT in the push
      # step has to be the only credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: remove js files in dist/
        run: find dist/ -type f \( -name "*.json" -o -name "*.js" -o -name "*.js.map" \) -delete
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dependabot
          path: dist/
      - name: Push the rebuilt bundle onto the Dependabot branch
        env:
          # A commit pushed with GITHUB_TOKEN does not start workflow runs, so the
          # rebuilt commit would never be checked. Dependabot-triggered runs
          # cannot read regular Actions secrets either: this has to be a
          # Dependabot secret (Settings -> Secrets and variables -> Dependabot).
          # The token is scoped to this step, and this step runs no npm command,
          # so the bumped package's install scripts never see it.
          PUSH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::DEPENDABOT_PUSH_TOKEN is not set as a Dependabot secret; the bundle was not rebuilt."
            exit 0
          fi
          # A human commit with this subject must not be mistaken for a rebuild,
          # so check the author of the head commit as well.
          if [ "$(git log -1 --format=%ae)" = "41898282+github-actions[bot]@users.noreply.github.com" ] \
            && git log -1 --pretty=%B | grep -q '^chore(dist): rebuild'; then
            echo "The head commit is already a rebuild; nothing to push."
            exit 0
          fi
          git add dist/
          if git diff --cached --quiet --ignore-space-at-eol -- dist/; then
            echo "dist/ already matches the manifest; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "chore(dist): rebuild the bundle for this dependency bump"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"